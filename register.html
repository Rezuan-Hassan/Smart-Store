<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Store - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --brand-green: #00b074;
            --brand-green-dark: #009660;
        }
        .bg-brand { background-color: var(--brand-green); }
        .bg-brand-hover:hover { background-color: var(--brand-green-dark); }
        .text-brand { color: var(--brand-green); }
        .focus-brand:focus { 
            border-color: var(--brand-green); 
            box-shadow: 0 0 0 2px rgba(0, 176, 116, 0.2);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Main Register Container -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl flex overflow-hidden min-h-[600px]">
        
        <!-- Left Panel (Brand) -->
        <div class="hidden md:flex w-1/2 bg-brand flex-col justify-center items-center text-white p-12 text-center relative overflow-hidden">
            <div class="absolute top-[-50px] left-[-50px] w-40 h-40 bg-white opacity-10 rounded-full"></div>
            <div class="absolute bottom-[-50px] right-[-50px] w-40 h-40 bg-white opacity-10 rounded-full"></div>

            <i class="ph-fill ph-storefront text-8xl mb-6 drop-shadow-md"></i>
            <h1 class="text-4xl font-bold mb-4 tracking-wide">Join Smart-Store</h1>
            <p class="text-lg opacity-90">Start managing your inventory, tracking sales, and growing your business today.</p>
        </div>

        <!-- Right Panel (Register Form) -->
        <div class="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center overflow-y-auto">
            
            <div class="mb-6 text-center md:text-left">
                <i class="ph-fill ph-storefront text-5xl text-brand mb-4 md:hidden mx-auto"></i>
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Create Account</h2>
                <p class="text-gray-500">Set up your store in seconds.</p>
            </div>

            <div id="errorMessage" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm flex items-center">
                <i class="ph ph-warning-circle text-lg mr-2"></i>
                <span id="errorText">Error creating account.</span>
            </div>

            <form id="registerForm" class="space-y-4">
                <!-- Full Name Input -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-user text-gray-400 text-xl"></i>
                    </div>
                    <input type="text" id="fullName" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl outline-none transition-all focus-brand text-gray-700" 
                        placeholder="Full Name">
                </div>

                <!-- Store Name Input -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-buildings text-gray-400 text-xl"></i>
                    </div>
                    <input type="text" id="storeName" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl outline-none transition-all focus-brand text-gray-700" 
                        placeholder="Store Name">
                </div>

                <!-- Email Input -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-envelope text-gray-400 text-xl"></i>
                    </div>
                    <input type="email" id="email" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl outline-none transition-all focus-brand text-gray-700" 
                        placeholder="Email Address">
                </div>

                <!-- Password Input -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="ph ph-lock-key text-gray-400 text-xl"></i>
                    </div>
                    <input type="password" id="password" required minlength="6"
                        class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl outline-none transition-all focus-brand text-gray-700" 
                        placeholder="Create Password (min 6 chars)">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="registerBtn"
                    class="w-full bg-brand bg-brand-hover text-white font-bold py-3 rounded-xl transition-all shadow-lg hover:shadow-xl flex items-center justify-center mt-2">
                    <span>Create Account</span>
                    <i class="ph ph-user-plus text-xl ml-2"></i>
                </button>
            </form>

            <!-- Login Link -->
            <div class="mt-6 text-center">
                <p class="text-gray-600 text-sm">
                    Already have an account? 
                    <a href="login.html" class="text-brand font-bold hover:underline">Login here</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Firebase & Auth Logic -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
