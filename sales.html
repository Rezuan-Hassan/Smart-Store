<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Store - Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --brand-green: #00b074;
            --brand-green-light: #e6f7f1;
            --brand-green-dark: #009660;
        }
        .text-brand { color: var(--brand-green); }
        .bg-brand { background-color: var(--brand-green); }
        .bg-brand-hover:hover { background-color: var(--brand-green-dark); }
        .bg-brand-light { background-color: var(--brand-green-light); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        /* Drawer Transitions */
        #drawerOverlay.active { opacity: 1; visibility: visible; }
        #drawerOverlay { opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        #salesDrawer.active { transform: translateX(0); }
        #salesDrawer { transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden text-gray-800 relative">

    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex z-20">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <i class="ph-fill ph-storefront text-3xl text-brand mr-2"></i>
            <span class="text-xl font-bold tracking-tight">Smart-Store</span>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="dashboard.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl font-medium transition-colors" onclick="navigate(event, 'dashboard.html')">
                <i class="ph ph-squares-four text-xl mr-3"></i>
                Dashboard
            </a>
            <a href="products.html" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-xl font-medium transition-colors" onclick="navigate(event, 'products.html')">
                <i class="ph ph-package text-xl mr-3"></i>
                Products
            </a>
            <a href="sales.html" class="flex items-center px-4 py-3 bg-brand-light text-brand rounded-xl font-medium transition-colors" onclick="navigate(event, 'sales.html')">
                <i class="ph-fill ph-receipt text-xl mr-3"></i>
                Sales
            </a>
            
        </nav>

        <div class="p-4 border-t border-gray-200">
            <button id="logoutBtn" class="flex items-center w-full px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl font-medium transition-colors">
                <i class="ph ph-sign-out text-xl mr-3"></i>
                Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 sm:px-6 z-10">
            <div class="flex items-center">
                <button class="md:hidden text-gray-500 hover:text-gray-700 mr-4">
                    <i class="ph ph-list text-2xl"></i>
                </button>
                <h2 class="text-xl font-semibold hidden sm:block">Point of Sale</h2>
            </div>
            <div class="flex items-center space-x-4">
                <button class="relative p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-colors">
                    <i class="ph ph-bell text-xl"></i>
                </button>
                <div class="flex items-center space-x-2 cursor-pointer p-1 rounded-lg hover:bg-gray-50 transition-colors">
                    <div class="w-8 h-8 rounded-full bg-brand-light flex items-center justify-center text-lg">👨‍💼</div>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Sales Records</h1>
                    <p class="text-gray-500 text-sm mt-1">View and manage store transactions</p>
                </div>
                
                <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">
                    <button onclick="toggleDrawer()" class="bg-brand bg-brand-hover text-white px-5 py-2.5 rounded-lg font-bold transition-colors flex items-center justify-center shadow-md hover:shadow-lg">
                        <i class="ph ph-receipt font-bold mr-2 text-lg"></i> New Sale
                    </button>
                </div>
            </div>

            <div class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden">
                <div class="p-4 border-b border-gray-100 flex flex-wrap gap-3 items-center justify-between">
                    <div class="relative w-full sm:w-64">
                        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="Search Invoice ID..." class="w-full pl-9 pr-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-brand text-sm bg-gray-50">
                    </div>
                    <select class="border border-gray-200 rounded-lg px-4 py-2 text-sm bg-gray-50 text-gray-600 outline-none">
                        <option>All Time</option>
                        <option>Today</option>
                        <option>This Week</option>
                    </select>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-gray-50 border-b border-gray-200 text-gray-600 font-medium">
                            <tr>
                                <th class="px-6 py-4">Invoice ID</th>
                                <th class="px-6 py-4">Date</th>
                                <th class="px-6 py-4">Customer</th>
                                <th class="px-6 py-4">Items</th>
                                <th class="px-6 py-4">Total</th>
                                <th class="px-6 py-4">Status</th>
                            </tr>
                        </thead>
                        <tbody id="salesTableBody" class="divide-y divide-gray-100 text-gray-700">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="drawerOverlay" onclick="toggleDrawer()" class="fixed inset-0 bg-black bg-opacity-40 z-40 backdrop-blur-sm"></div>

    <div id="salesDrawer" class="fixed top-0 right-0 h-full w-full sm:w-[450px] bg-white shadow-2xl z-50 flex flex-col border-l border-gray-200">
        
        <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
            <h2 class="text-xl font-bold text-gray-800 flex items-center">
                <i class="ph-fill ph-shopping-cart text-brand mr-2 text-2xl"></i> Current Sale
            </h2>
            <button onclick="toggleDrawer()" class="p-2 text-gray-400 hover:text-gray-800 rounded-full hover:bg-gray-200 transition-colors">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>

        <div class="p-4 border-b border-gray-200">
            <div class="relative">
                <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                <input id="productSearchInput" type="text" onkeypress="if(event.key === 'Enter') searchAndAddProduct(this.value)" placeholder="Search product by name or SKU... (Press Enter)" class="w-full pl-9 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand shadow-sm">
            </div>
        </div>

        <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50/50">
            <div class="text-center py-8 text-gray-400 text-sm">Cart is empty. Search for items above!</div>
        </div>

        <div class="border-t border-gray-200 bg-white p-6 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <div class="space-y-3 mb-4">
                <div class="flex justify-between text-gray-500 text-sm">
                    <span>Subtotal</span>
                    <span id="cartSubtotal" class="font-medium text-gray-800">$0.00</span>
                </div>
                <div class="flex justify-between text-gray-500 text-sm">
                    <span>Tax (0%)</span>
                    <span class="font-medium text-gray-800">$0.00</span>
                </div>
                <div class="flex justify-between items-center pt-3 border-t border-gray-100">
                    <span class="font-bold text-gray-800">Total</span>
                    <span id="cartTotal" class="text-2xl font-black text-brand">$0.00</span>
                </div>
            </div>
            
            <button onclick="completeSale()" class="w-full bg-brand hover:bg-brand-hover text-white font-bold py-4 rounded-xl transition-colors shadow-md hover:shadow-lg flex items-center justify-center text-lg">
                <i class="ph ph-check-circle mr-2 text-xl"></i> Complete Sale
            </button>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
